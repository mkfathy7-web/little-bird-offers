# فحص العروض كل ساعة من 8 الصبح لـ 12 بالليل بتوقيت القاهرة (UTC+2: الساعة 6 لـ 22 UTC).
# الكود بس في الريبو العام ده. الأسعار بتترفع على المخزن المقفول في Supabase بالمفتاح السري، ومفيش commit لأي بيانات.
# مفيش pull_request: المفاتيح عمرها ما توصل لـ PR من fork.
name: فحص العروض

on:
  schedule:
    - cron: "7 6-22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offers
  cancel-in-progress: false

jobs:
  offers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      ARKHAS_CONTACT: ${{ secrets.ARKHAS_CONTACT }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: الاختبارات
        run: python -m unittest discover tests
      - name: العروض ← Supabase (مقفول)
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then echo "المفتاح مش متحط، اتساب"; exit 0; fi
          python offers.py --upload >> "$GITHUB_STEP_SUMMARY"
